<h2>Buscar Establecimiento</h2>

<input
  type="text"
  placeholder="Buscar por nombre..."
  [(ngModel)]="textoBusqueda"
  (input)="buscar()"
/>

<table>
  <thead>
    <tr>
      <th>ID_establecimiento</th>
      <th>Nombre</th>
      <th>Direccion</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let estab of establecimiento">
      <td>{{ estab.idEstab }}</td>
      <td>{{ estab.nombre }}</td>
      <td>{{ estab.direccion }}</td>
    </tr>
  </tbody>
</table>
